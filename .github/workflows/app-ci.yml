name: App CI

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "terraform/**"
      - "requirements*.txt"
      - "pytest.ini"
      - ".github/workflows/app-ci.yml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "terraform/**"
      - "requirements*.txt"
      - "pytest.ini"
      - ".github/workflows/app-ci.yml"

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest
